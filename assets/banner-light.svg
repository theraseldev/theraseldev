    <text x="42" y="134" font-family="Consolas, Menlo, monospace" font-size="14" fill="#334155">stack</text>
    <text x="42" y="160" font-family="Consolas, Menlo, monospace" font-size="14" fill="#7C3AED">python</text>
    <text x="112" y="160" font-family="Consolas, Menlo, monospace" font-size="14" fill="#94A3B8">/</text>
    <text x="126" y="160" font-family="Consolas, Menlo, monospace" font-size="14" fill="#2563EB">automation</text>
    <text x="238" y="160" font-family="Consolas, Menlo, monospace" font-size="14" fill="#94A3B8">/</text>
    <text x="252" y="160" font-family="Consolas, Menlo, monospace" font-size="14" fill="#0891B2">ai</text>
    <rect x="274" y="145" width="9" height="18" fill="#0891B2">
