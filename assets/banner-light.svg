    <path d="M0 44 H474" stroke="#DBE3EE" stroke-width="1.2"/>
    <circle cx="24" cy="22" r="5.5" fill="#FF5F57"/>
    <circle cx="44" cy="22" r="5.5" fill="#FEBC2E"/>
    <circle cx="64" cy="22" r="5.5" fill="#28C840"/>
    <text x="404" y="27" font-family="Consolas, Menlo, monospace" font-size="12" fill="#94A3B8">~/dev</text>

    <text x="24" y="78" font-family="Consolas, Menlo, monospace" font-size="14" fill="#0891B2">$</text>
    <text x="42" y="78" font-family="Consolas, Menlo, monospace" font-size="14" fill="#334155">whoami</text>
    <text x="42" y="104" font-family="Consolas, Menlo, monospace" font-size="14" fill="#0F172A">rasel ahmed</text>

