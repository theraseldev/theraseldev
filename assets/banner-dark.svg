<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Rasel Ahmed - Python Automation, Web Tools and AI">
  <title>Rasel Ahmed - Python Automation, Web Tools and AI</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080F"/>
      <stop offset="0.55" stop-color="#0A1020"/>
      <stop offset="1" stop-color="#0D1730"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <circle cx="1260" cy="20" r="360" fill="url(#glowV)"/>
  <circle cx="60" cy="330" r="330" fill="url(#glowC)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>

  <!-- top hairline accent -->
  <rect x="0" y="0" width="1280" height="3" fill="url(#accent)" opacity="0.9"/>

  <!-- left column -->
  <text x="80" y="88" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="5" fill="#22D3EE">DEVELOPER · BUILDER</text>

  <text x="78" y="164" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="1.5" fill="#F8FAFC">RASEL</text>
  <text x="78" y="213" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="1.5" fill="url(#accent)">AHMED</text>

  <rect x="80" y="238" width="96" height="3" rx="1.5" fill="url(#accent)"/>

  <text x="80" y="272" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" letter-spacing="0.6" fill="#94A3B8">Python Automation · Web Tools · AI</text>

  <!-- right terminal card -->
  <g transform="translate(726 68)">
    <rect x="0" y="3" width="474" height="186" rx="16" fill="#22D3EE" opacity="0.10" filter="url(#soft)"/>
    <rect x="0" y="0" width="474" height="186" rx="16" fill="#080E1B" stroke="#1E2A45" stroke-width="1.5"/>
    <path d="M0 44 H474" stroke="#1E2A45" stroke-width="1.2"/>
    <circle cx="24" cy="22" r="5.5" fill="#FF5F57"/>
    <circle cx="44" cy="22" r="5.5" fill="#FEBC2E"/>
    <circle cx="64" cy="22" r="5.5" fill="#28C840"/>
    <text x="404" y="27" font-family="Consolas, Menlo, monospace" font-size="12" fill="#475569">~/dev</text>

    <text x="24" y="78" font-family="Consolas, Menlo, monospace" font-size="14" fill="#22D3EE">$</text>
    <text x="42" y="78" font-family="Consolas, Menlo, monospace" font-size="14" fill="#CBD5E1">whoami</text>
    <text x="42" y="104" font-family="Consolas, Menlo, monospace" font-size="14" fill="#F1F5F9">rasel ahmed</text>

    <text x="24" y="134" font-family="Consolas, Menlo, monospace" font-size="14" fill="#22D3EE">$</text>
    <text x="42" y="134" font-family="Consolas, Menlo, monospace" font-size="14" fill="#CBD5E1">stack</text>
    <text x="42" y="160" font-family="Consolas, Menlo, monospace" font-size="14" fill="#A78BFA">python</text>
    <text x="112" y="160" font-family="Consolas, Menlo, monospace" font-size="14" fill="#475569">/</text>
    <text x="126" y="160" font-family="Consolas, Menlo, monospace" font-size="14" fill="#60A5FA">automation</text>
    <text x="238" y="160" font-family="Consolas, Menlo, monospace" font-size="14" fill="#475569">/</text>
    <text x="252" y="160" font-family="Consolas, Menlo, monospace" font-size="14" fill="#22D3EE">ai</text>
    <rect x="274" y="145" width="9" height="18" fill="#22D3EE">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
