<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250" role="img" aria-label="Selected work: telegram-automation and FaceBook Group AutoPoster Pro">
  <title>Selected work</title>
  <defs>
