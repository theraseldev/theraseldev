  <rect x="742" y="156" width="98" height="30" rx="15" fill="#0E1B2F" stroke="#1F3B52" stroke-width="1"/>
  <text x="791" y="175" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#A78BFA">JavaScript</text>
