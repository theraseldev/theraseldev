  <!-- row 2 -->
  <rect x="0.75" y="148" width="3.5" height="62" fill="url(#bar)"/>
  <text x="40" y="182" font-family="Consolas, Menlo, monospace" font-size="12" letter-spacing="1.5" fill="#A78BFA">02</text>
