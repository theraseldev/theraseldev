  <!-- row 1 -->
  <rect x="0.75" y="34" width="3.5" height="62" fill="url(#bar)"/>
  <text x="40" y="68" font-family="Consolas, Menlo, monospace" font-size="12" letter-spacing="1.5" fill="#22D3EE">01</text>
  <text x="78" y="66" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="600" fill="#F1F5F9">telegram-automation</text>
  <text x="78" y="94" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#94A3B8">Telegram bot automation toolkit — scripted messaging workflows on the Bot API.</text>
  <rect x="742" y="42" width="98" height="30" rx="15" fill="#0E1B2F" stroke="#1F3B52" stroke-width="1"/>
  <text x="791" y="61" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#22D3EE">Python</text>

