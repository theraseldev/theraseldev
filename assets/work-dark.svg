      <stop offset="0" stop-color="#0A1120"/>
      <stop offset="1" stop-color="#0C1830"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
